apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-admin
  labels:
    app: go-admin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: go-admin
        image: go-admin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_PORT
          value: "8081"
        - name: TZ
          value: "Asia/Shanghai"
        volumeMounts:
        - name: config
          mountPath: /app/configs
        - name: logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 10
      volumes:
      - name: config
        configMap:
          name: go-admin-config
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - go-admin
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: go-admin
  labels:
    app: go-admin
spec:
  selector:
    app: go-admin
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-admin-config
data:
  config.yaml: |
    app:
      name: go-admin
      mode: production
      port: 8081
      version: 1.0.0
    log:
      level: info
      filename: logs/app.log
      max_size: 100
      max_age: 7
      max_backups: 10
    mysql:
      host: mysql
      port: 3306
      user: root
      password: root
      dbname: go_admin
    redis:
      host: redis
      port: 6379
      password: ""
      db: 0
    jwt:
      secret: your-secret-key
      expire: 86400 