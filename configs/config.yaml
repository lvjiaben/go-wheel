app:
  name: "FrameWork"
  mode: "debug"
  port: 8801
  version: "1.0.0"
  max_request_body: 10  # 最大请求体大小（MB）

log:
  level: "debug"
  filename: "runtime.log"
  max_size: 200
  max_backups: 7
  max_age: 30

database:
  driver: "mysql"       # 数据库驱动：mysql 或 postgres
  host: "127.0.0.1"
  port: 3306            # MySQL: 3306, PostgreSQL: 5432
  user: "root"
  pass: ""
  dbname: "go-admin"
  charset: "utf8mb4"    # 仅 MySQL 使用
  sslmode: "disable"    # 仅 PostgreSQL 使用：disable, require, verify-ca, verify-full
  timezone: "Asia/Shanghai"  # 时区设置
  max_open_conns: 100
  max_idle_conns: 20
  max_lifetime: 3600    # 连接最大生命周期（秒）
  max_idle_time: 1800   # 空闲连接最大生命周期（秒）

redis:
  state: true
  host: "127.0.0.1"
  port: 6379
  pass: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10    # 最小空闲连接数
  max_conn_age: 3600    # 连接最大生命周期（秒）
  idle_timeout: 300     # 空闲连接超时（秒）
  pool_timeout: 5       # 获取连接超时（秒）
  read_timeout: 3       # 读取超时（秒）
  write_timeout: 3      # 写入超时（秒）
  enable_metrics: true  # 是否开启指标监控

rabbitmq:
  state: true           # 是否启用
  host: "127.0.0.1"
  port: 5672
  virtual_host: "/"
  user: "guest"
  pass: "guest"
  queue_name: "go-admin"           # 普通队列名称
  delay_queue_name: "go-admin-delay" # 延迟队列名称
  exchange: "go-admin-exchange"      # 普通交换机
  delay_exchange: "go-admin-delay-exchange" # 延迟交换机
  retry_count: 3                     # 重试次数
  reconnect_interval: 5             # 重连间隔（秒）
  heartbeat_interval: 30            # 心跳间隔（秒）
  connection_timeout: 10            # 连接超时（秒）
  enable_confirmation: true         # 是否开启发布确认
  prefetch_count: 10                # 预取数量
  prefetch_size: 0                  # 预取大小（0表示无限制）
  default_consumer_name: "go-admin-consumer" # 默认消费者名称

jwt:
  secret: "go-admin-test"
  expire_day: 7
  issuer: "go-admin"

admin:
  login_failures: 3
  login_failures_second: 3600
  login_sso: true

api:
  login_sso: true  # 是否开启单点登录（同一账号只能在一处登录）

# 文件上传配置
upload:
  type: "local"        # 存储类型：local, oss, qiniu, cos
  base_url: "http://localhost:8801"  # 访问域名
  upload_path: "/public/uploads"     # 上传路径
  max_size: 10485760   # 最大文件大小(10MB)
  allowed_types: ["image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf", "text/plain"]
  allowed_extensions: ["jpg", "jpeg", "png", "gif", "webp", "pdf", "txt"]
  
  # 阿里云OSS配置
  oss:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket_name: ""

  # 七牛云配置  
  qiniu:
    region: "华东"      # 存储区域
    access_key: ""
    secret_key: ""
    bucket: ""

  # 腾讯云COS配置
  cos:
    secret_id: ""
    secret_key: ""
    region: "ap-guangzhou"
    bucket: ""          # bucket-appid 格式
